name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release version to build with; when set, the exec jar is uploaded as an artifact"
        type: string
        required: false
        default: ""
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/ci.yml"
      - "gradle/**"
      - "**/src/**"
      - "**/*.gradle.kts"
      - "**/gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  pull_request:
    branches:
      - "main"
  schedule:
    - cron: "0 3 * * 0"

concurrency:
  # Only pull request runs share a group, so a new push cancels the previous build of the same PR. Every other run -
  # main pushes, schedule, manual and calls from release.yml (which share the caller's GitHub context) - gets a
  # unique group and is never canceled.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Java 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: "true"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ci-${{ runner.os }}-java-25-${{ hashFiles('**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ci-${{ runner.os }}-java-25-

      # Release builds only - the released jar serves the web UI, built fresh from webapp/ into src/main/resources/static
      # (git-ignored), so the Gradle build packages it. Regular builds leave it out.
      - name: Set up Node.js
        if: inputs.version != ''
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "webapp/package-lock.json"

      - name: Build Web UI
        if: inputs.version != ''
        working-directory: webapp
        run: |
          npm ci
          npm run build

      - name: Gradle Build
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.caching=false
            -Dorg.gradle.configuration-cache=false
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=false
            -Dorg.gradle.workers.max=1
          VERSION: ${{ inputs.version }}
        run: ./gradlew build ${VERSION:+"-Pversion=$VERSION"}

      - name: Upload coverage report to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          files: ./build/reports/kover/report.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Verify Web UI in Exec Jar
        if: inputs.version != ''
        run: unzip -l build/libs/*-exec.jar | grep -F 'BOOT-INF/classes/static/index.html'

      - name: Upload Exec Jar
        if: inputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: exec-jar
          path: build/libs/*-exec.jar
          if-no-files-found: error
          retention-days: 1

  automerge:
    name: Dependabot PR Auto-Merge
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Auto-Merge
        run: |
          if ! gh pr merge --squash --auto "$PR_URL"; then
            echo "::warning::Automatic merge (--squash) of dependabot PR failed."
            exit 1
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
