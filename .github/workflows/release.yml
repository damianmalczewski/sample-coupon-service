# Manually triggered release, following the cactus model: main always holds the newest version line, older lines are
# patched on release/X.Y.x branches (e.g. release/1.2.x for 1.2.0, 1.2.1, ...).
#
# 1. Compute Version - bumps the chosen part (patch, minor or major) of a vX.Y.Z git tag:
#    - on main, of the highest tag; the first release bumps from 0.0.0 (v0.0.1, v0.1.0 or v1.0.0),
#    - on release/X.Y.x, of the highest vX.Y.* tag; only "patch" is allowed, the line must already be released and must
#      not be the newest one (which belongs to main).
#    Refuses to run on other branches, on an already released commit, or when the tag already exists.
# 2. Build - runs the regular CI build (ci.yml) with the computed version, so the released jar is the tested one. CI builds
#    the web UI fresh from webapp/ first, so the jar serves it.
# 3. Publish - builds the Docker image from that jar and pushes it to ghcr.io as X.Y.Z and X.Y, as X only when it is
#    the highest release of that major, and as latest only from main. Then creates the annotated vX.Y.Z git tag
#    ("Release X.Y.Z") and GitHub release (marked as latest only from main) with notes listing the commits since the
#    previous release on the same branch.
#
# Git tags are prefixed with "v", image tags are not. A release/X.Y.x branch runs its own copy of this workflow and of
# ci.yml, so it needs their current versions.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        type: choice
        options:
          - "patch"
          - "minor"
          - "major"
        default: "patch"

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous-tag: ${{ steps.version.outputs.previous-tag }}
      is-latest: ${{ steps.version.outputs.is-latest }}
      is-major-latest: ${{ steps.version.outputs.is-major-latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute Version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          release_tag='^v[0-9]+\.[0-9]+\.[0-9]+$'

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            line=""
          elif [[ "$GITHUB_REF" =~ ^refs/heads/release/([0-9]+)\.([0-9]+)\.x$ ]]; then
            line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          else
            echo "::error::Releases can only be made from main or release/X.Y.x, got $GITHUB_REF"
            exit 1
          fi
          if [ -z "$line" ]; then line_description="newest version line"; else line_description="version line $line"; fi
          echo "Branch ${GITHUB_REF#refs/heads/} ($line_description), bump $BUMP, commit $GITHUB_SHA"

          released=$(git tag --points-at HEAD | grep -E "$release_tag" || true)
          if [ -n "$released" ]; then
            echo "::error::Commit $GITHUB_SHA is already released as $released"
            exit 1
          fi

          tags=$(git tag -l | grep -E "$release_tag" | sort -V || true)
          highest="$(echo "$tags" | tail -n 1)"
          highest="${highest#v}"
          echo "::group::Release tags ($(echo "$tags" | grep -c . || true))"
          echo "${tags:-none}"
          echo "::endgroup::"
          echo "Highest release: ${highest:-none}"

          if [ -z "$line" ]; then
            # The first release bumps from 0.0.0, i.e. 0.0.1, 0.1.0 or 1.0.0.
            IFS=. read -r major minor patch <<< "${highest:-0.0.0}"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
          else
            if [ "$BUMP" != "patch" ]; then
              echo "::error::Only patch releases can be made from release/$line.x, got $BUMP"
              exit 1
            fi
            if [ "$line" = "${highest%.*}" ]; then
              echo "::error::$line is the newest version line, release it from main"
              exit 1
            fi
            line_highest=$(echo "$tags" | grep -E "^v${line//./\\.}\." | tail -n 1 || true)
            if [ -z "$line_highest" ]; then
              echo "::error::Version line $line has never been released, there is nothing to patch"
              exit 1
            fi
            echo "Highest release in version line $line: $line_highest"
            IFS=. read -r major minor patch <<< "${line_highest#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi

          # The X image tag moves only when this is the highest release of its major version, latest only from main.
          major="${version%%.*}"
          major_highest=$(printf '%s\n%s\n' "$tags" "$tag" | grep -E "^v$major\." | sort -V | tail -n 1)
          is_major_latest=$([ "$major_highest" = "$tag" ] && echo true || echo false)
          is_latest=$([ -z "$line" ] && echo true || echo false)

          # Nearest release reachable from this commit, i.e. the previous release on the same branch.
          previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2> /dev/null || true)

          echo "Previous release on this branch: ${previous_tag:-none}"
          echo "Highest of major $major: $is_major_latest, latest: $is_latest"
          echo "::notice::Releasing $tag from ${GITHUB_REF#refs/heads/} (previous: ${previous_tag:-none})"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "previous-tag=$previous_tag"
            echo "is-latest=$is_latest"
            echo "is-major-latest=$is_major_latest"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/ci.yml
    # Ceiling for the jobs of the called workflow - the build job itself only uses `contents: read`, but the
    # Dependabot auto-merge job (skipped outside of pull requests) declares write permissions, and a called workflow
    # may not request more than its caller grants.
    permissions:
      contents: write
      pull-requests: write
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.version.outputs.previous-tag }}
      IS_LATEST: ${{ needs.version.outputs.is-latest }}
      IS_MAJOR_LATEST: ${{ needs.version.outputs.is-major-latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Exec Jar
        uses: actions/download-artifact@v8
        with:
          name: exec-jar
          path: build/libs

      - name: Build and Push Image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          refs=("$image:$VERSION" "$image:${VERSION%.*}")
          if [ "$IS_MAJOR_LATEST" = "true" ]; then refs+=("$image:${VERSION%%.*}"); fi
          if [ "$IS_LATEST" = "true" ]; then refs+=("$image:latest"); fi
          tags=()
          for ref in "${refs[@]}"; do tags+=(--tag "$ref"); done

          echo "Image $image, version $VERSION, commit $GITHUB_SHA"
          echo "Tags: ${refs[*]#"$image:"}"
          ls -l build/libs

          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

          echo "::group::Build image"
          docker build \
            --progress plain \
            --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.description=A throwaway application, used as a sandbox for trying out ideas." \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "${tags[@]}" \
            .
          echo "::endgroup::"
          docker image inspect "${refs[0]}" \
            --format 'Built image {{.Id}}, size {{.Size}} bytes, labels {{json .Config.Labels}}'

          for ref in "${refs[@]}"; do
            echo "::group::Push $ref"
            docker push "$ref"
            echo "::endgroup::"
          done
          docker rmi "${refs[@]}"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          range="${PREVIOUS_TAG:+$PREVIOUS_TAG..}HEAD"

          {
            echo "## Image"
            echo
            echo '```'
            echo "docker pull $image:$VERSION"
            echo '```'
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
          } > release-notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Pushed annotated tag $TAG"

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --latest="$IS_LATEST" \
            --notes-file release-notes.md
